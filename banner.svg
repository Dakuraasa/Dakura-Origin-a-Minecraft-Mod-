<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Datura Origins banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d8f0"/>
      <stop offset="18%" stop-color="#e8bfd6"/>
      <stop offset="45%" stop-color="#7d4b7e"/>
      <stop offset="100%" stop-color="#180d1c"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#fff7ff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f7d5ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f7d5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#ffebff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#d9a9dd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d9a9dd" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="82%" cy="42%" r="26%">
      <stop offset="0%" stop-color="#f9d9ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f9d9ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>

    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba0d8" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#2d132c" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowLeft)"/>
  <rect width="1600" height="900" fill="url(#glowCenter)"/>
  <rect width="1600" height="900" fill="url(#glowRight)"/>

  <g opacity="0.35" filter="url(#blurSoft)">
    <ellipse cx="220" cy="610" rx="540" ry="200" fill="#f7d9ff"/>
    <ellipse cx="990" cy="650" rx="520" ry="220" fill="#f0b7ff"/>
  </g>

  <g opacity="0.35" filter="url(#blurSoft)">
    <path d="M792 250 L835 420 L820 815 L772 815 L740 575 L760 250 Z" fill="#f8d8ff"/>
    <path d="M792 250 L835 420 L820 815 L772 815 L740 575 L760 250 Z" fill="#f8d8ff" transform="translate(110 0) scale(0.88)" opacity="0.7"/>
  </g>

  <g opacity="0.85">
    <path d="M700 230 L825 220 L865 720 L810 720 L770 610 L742 620 L730 470 L700 230 Z" fill="#f3e3ef" fill-opacity="0.8"/>
    <path d="M700 230 L825 220 L865 720 L810 720 L770 610 L742 620 L730 470 L700 230 Z" filter="url(#blurSoft)" opacity="0.7"/>
  </g>

  <g opacity="0.5" fill="#e6c1e3">
    <circle cx="560" cy="300" r="9"/>
    <circle cx="620" cy="330" r="6"/>
    <circle cx="690" cy="340" r="5"/>
    <circle cx="760" cy="280" r="7"/>
    <circle cx="930" cy="320" r="8"/>
    <circle cx="980" cy="390" r="7"/>
    <circle cx="1040" cy="360" r="6"/>
  </g>

  <path d="M0 740 C250 660, 420 620, 580 680 S980 790, 1600 720 L1600 900 L0 900 Z" fill="url(#groundFade)" opacity="0.9"/>

  <g opacity="0.18" filter="url(#blurSoft)">
    <ellipse cx="800" cy="710" rx="620" ry="140" fill="#ffecff"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.8"/>
</svg>
